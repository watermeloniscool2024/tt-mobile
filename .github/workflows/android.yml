name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev ccache git zip unzip libncurses5 libtinfo5 libstdc++6
          pip install --upgrade pip
          # Fixed the space typo in the URL below
          pip install Cython==3.0.11 git+https://github.com virtualenv

      - name: Build APK with Buildozer
        run: |
          buildozer android debug
        env:
          ACCEPT_SDK_LICENSE: "y"
